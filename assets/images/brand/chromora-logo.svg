<svg xmlns="http://www.w3.org/2000/svg" width="380" height="110" viewBox="0 0 380 110" >
  
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBB285" />
      <stop offset="50%" stop-color="#B89562" />
      <stop offset="100%" stop-color="#9A7B4A" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3D5D" />
      <stop offset="100%" stop-color="#142E4A" />
    </linearGradient>
    
    <!-- Filter for a subtle premium shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(0, 0)">
    
  <path d="M 45 20 L 75 20 L 75 40 L 45 40 C 36.7 40 30 46.7 30 55 C 30 63.3 36.7 70 45 70 L 75 70 L 75 90 L 45 90 C 25.7 90 10 74.3 10 55 C 10 35.7 25.7 20 45 20 Z" fill="url(#navyGrad)" />
  <!-- Overlapping geometric gold shape to represent layers/painting/finish -->
  <path d="M 55 45 L 85 15 L 100 30 L 70 60 Z" fill="url(#goldGrad)" />
  <path d="M 55 65 L 85 95 L 100 80 L 70 50 Z" fill="#9A7B4A" opacity="0.8" />

  </g>
  
  <!-- Wordmark -->
  <text x="110" y="65" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-weight="800" font-size="44" fill="#142E4A" letter-spacing="-0.5">Chromora</text>
  
  <!-- Tagline -->
  <text x="114" y="88" font-family="'Manrope', 'Helvetica Neue', sans-serif" font-weight="700" font-size="12" fill="#8B9AAB" letter-spacing="4">PAINTING EXPERTS</text>
</svg>