<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Wall -->
    <rect x="0" y="0" width="800" height="480" class="room-wall" fill="#F6F2E9" transition="fill 0.4s ease"/>
    <!-- Floor -->
    <polygon points="0,480 800,480 800,600 0,600" fill="#8c7b6e"/>
    <!-- Bed -->
    <rect x="200" y="250" width="400" height="150" fill="#4a4a4a" rx="10"/> <!-- headboard -->
    <rect x="180" y="380" width="440" height="120" fill="#f0ece1" rx="8"/> <!-- mattress/comforter -->
    <rect x="180" y="470" width="440" height="30" fill="#2d2d2d"/> <!-- frame -->
    <!-- Pillows -->
    <rect x="220" y="340" width="160" height="60" fill="#fff" rx="10"/>
    <rect x="420" y="340" width="160" height="60" fill="#fff" rx="10"/>
    <rect x="300" y="360" width="100" height="40" fill="#829bae" rx="8"/> <!-- accent pillow -->
    <!-- Nightstands -->
    <rect x="80" y="400" width="90" height="100" fill="#5c4a3d" rx="4"/>
    <rect x="630" y="400" width="90" height="100" fill="#5c4a3d" rx="4"/>
    <!-- Lamps -->
    <rect x="120" y="320" width="10" height="80" fill="#ccc"/>
    <polygon points="100,340 150,340 140,280 110,280" fill="#f9f9f9"/>
    <rect x="670" y="320" width="10" height="80" fill="#ccc"/>
    <polygon points="650,340 700,340 690,280 660,280" fill="#f9f9f9"/>
    <!-- Art -->
    <rect x="250" y="80" width="120" height="120" fill="#f4f4ef" rx="2" stroke="#222" stroke-width="3"/>
    <rect x="430" y="80" width="120" height="120" fill="#f4f4ef" rx="2" stroke="#222" stroke-width="3"/>
</svg>