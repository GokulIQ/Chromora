<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Wall -->
    <rect x="0" y="0" width="800" height="420" class="room-wall" fill="#F6F2E9" transition="fill 0.4s ease"/>
    <!-- Floor -->
    <polygon points="0,420 800,420 800,600 0,600" fill="#b09e8d"/>
    <!-- Chandelier -->
    <rect x="395" y="0" width="10" height="150" fill="#444"/>
    <rect x="250" y="140" width="300" height="20" fill="#b89562" rx="10"/>
    <circle cx="280" cy="180" r="20" fill="#fffcf0"/>
    <circle cx="400" cy="180" r="20" fill="#fffcf0"/>
    <circle cx="520" cy="180" r="20" fill="#fffcf0"/>
    <!-- Table -->
    <rect x="150" y="380" width="500" height="30" fill="#5c4a3d" rx="4"/>
    <rect x="200" y="410" width="30" height="150" fill="#4a3a2d"/>
    <rect x="570" y="410" width="30" height="150" fill="#4a3a2d"/>
    <!-- Chairs (Back) -->
    <rect x="250" y="280" width="60" height="120" fill="#e8ddcd" rx="8"/>
    <rect x="370" y="280" width="60" height="120" fill="#e8ddcd" rx="8"/>
    <rect x="490" y="280" width="60" height="120" fill="#e8ddcd" rx="8"/>
    <!-- Chairs (Front) -->
    <rect x="250" y="400" width="60" height="80" fill="#d8cddc" rx="4" opacity="0.8"/>
    <rect x="370" y="400" width="60" height="80" fill="#d8cddc" rx="4" opacity="0.8"/>
    <rect x="490" y="400" width="60" height="80" fill="#d8cddc" rx="4" opacity="0.8"/>
    <rect x="260" y="480" width="10" height="80" fill="#333"/>
    <rect x="300" y="480" width="10" height="80" fill="#333"/>
    <!-- Window -->
    <rect x="50" y="80" width="150" height="300" fill="#fcfcfc" rx="4"/>
    <rect x="60" y="90" width="130" height="280" fill="#b8d1d8"/>
    <rect x="120" y="90" width="10" height="280" fill="#fcfcfc"/>
</svg>