<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Sky -->
    <rect x="0" y="0" width="800" height="300" fill="#b1c8dd"/>
    <!-- House Siding (Colorable Wall) -->
    <polygon points="100,250 400,100 700,250 700,500 100,500" class="room-wall" fill="#F6F2E9" transition="fill 0.4s ease"/>
    <!-- Roof -->
    <polygon points="50,250 400,50 750,250 700,270 400,100 100,270" fill="#333"/>
    <!-- Trim / Fascia -->
    <polygon points="100,250 400,100 700,250 700,260 400,110 100,260" fill="#fcfcfc"/>
    <rect x="100" y="480" width="600" height="20" fill="#fcfcfc"/> <!-- foundation trim -->
    <!-- Door -->
    <rect x="360" y="350" width="80" height="150" fill="#243b55" rx="4"/>
    <rect x="370" y="360" width="60" height="60" fill="#fcfcfc" opacity="0.3"/>
    <circle cx="370" cy="430" r="5" fill="#e8ddcd"/>
    <!-- Windows -->
    <rect x="180" y="300" width="100" height="120" fill="#fcfcfc" rx="4"/>
    <rect x="190" y="310" width="80" height="100" fill="#e8f4f8"/>
    <rect x="225" y="310" width="10" height="100" fill="#fcfcfc"/>
    <rect x="190" y="355" width="80" height="10" fill="#fcfcfc"/>
    
    <rect x="520" y="300" width="100" height="120" fill="#fcfcfc" rx="4"/>
    <rect x="530" y="310" width="80" height="100" fill="#e8f4f8"/>
    <rect x="565" y="310" width="10" height="100" fill="#fcfcfc"/>
    <rect x="530" y="355" width="80" height="10" fill="#fcfcfc"/>
    <!-- Lawn -->
    <rect x="0" y="500" width="800" height="100" fill="#8f9a7a"/>
    <!-- Bushes -->
    <circle cx="150" cy="480" r="40" fill="#365a49"/>
    <circle cx="250" cy="490" r="30" fill="#365a49"/>
    <circle cx="650" cy="480" r="40" fill="#365a49"/>
</svg>