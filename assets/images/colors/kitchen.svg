<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <!-- Wall -->
    <rect x="0" y="0" width="800" height="400" class="room-wall" fill="#F6F2E9" transition="fill 0.4s ease"/>
    <!-- Backsplash -->
    <rect x="0" y="250" width="800" height="150" fill="#e8e8e8"/>
    <!-- Floor -->
    <polygon points="0,400 800,400 800,600 0,600" fill="#a09a90"/>
    <!-- Lower Cabinets -->
    <rect x="0" y="400" width="800" height="200" fill="#243b55"/>
    <rect x="0" y="380" width="800" height="20" fill="#fcfcfc"/> <!-- Countertop -->
    <rect x="50" y="420" width="150" height="160" fill="#1d2f44" rx="4"/>
    <rect x="250" y="420" width="150" height="160" fill="#1d2f44" rx="4"/>
    <rect x="450" y="420" width="150" height="160" fill="#1d2f44" rx="4"/>
    <!-- Range / Stove -->
    <rect x="620" y="400" width="150" height="200" fill="#dddddd"/>
    <rect x="630" y="420" width="130" height="100" fill="#111" rx="8"/> <!-- oven window -->
    <!-- Range Hood -->
    <polygon points="620,250 770,250 740,100 650,100" fill="#dddddd"/>
    <rect x="680" y="0" width="30" height="100" fill="#dddddd"/>
    <!-- Upper Cabinets -->
    <rect x="50" y="50" width="150" height="200" fill="#f4f4ef" rx="2"/>
    <rect x="250" y="50" width="150" height="200" fill="#f4f4ef" rx="2"/>
    <rect x="450" y="50" width="120" height="200" fill="#f4f4ef" rx="2"/>
    <!-- Island -->
    <rect x="150" y="480" width="400" height="120" fill="#fcfcfc"/> <!-- top -->
    <rect x="160" y="500" width="380" height="100" fill="#365a49"/> <!-- base -->
</svg>